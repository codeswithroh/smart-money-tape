name: MC alert poller

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:          # manual "Run workflow" button

concurrency:
  group: mc-alert-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the alert endpoint
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            "https://meme-attention-radar.vercel.app/api/cron?key=${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/out.json
          test "$code" = "200"
