<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Attention Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap">
<style>
  :root{ --paper:#f4ecd9; --card:#fdfaf0; --note:#fdf3cf; --ink:#2c3550; --soft:#565d70; --faint:#8a8a76; --accent:#cf3a26; --pos:#2f7c4d; --neg:#a5301c; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:26px;
    background:var(--paper); background-image:repeating-linear-gradient(var(--paper) 0 26px, rgba(110,100,70,.14) 26px 27px);
    color:var(--ink); font-family:"Patrick Hand","Comic Sans MS",cursive; font-size:16px;
  }
  .card{
    width:100%; max-width:440px; background:var(--card); border:2px solid var(--ink);
    border-radius:14px 8px 15px 7px / 8px 15px 7px 14px; padding:30px 26px 26px;
    box-shadow:6px 7px 0 rgba(44,53,80,.12);
  }
  h1{ font-family:"Caveat",cursive; font-size:36px; margin:0 0 2px; transform:rotate(-1deg); }
  .tag{ color:var(--soft); font-size:14px; margin:0 0 18px; }
  .row{ display:flex; flex-direction:column; gap:10px; }
  button, .btn{
    font:inherit; cursor:pointer; border:2px solid var(--ink); background:var(--card); color:var(--ink);
    border-radius:9px 5px 10px 5px; padding:11px 14px; text-align:center; text-decoration:none;
  }
  button.pri{ background:var(--accent); color:var(--paper); border-color:var(--ink); }
  button:disabled{ opacity:.55; cursor:default; }
  button:hover:not(:disabled){ transform:translateY(-1px); }
  select, input{
    font:inherit; color:var(--ink); background:#fff; border:2px solid var(--ink);
    border-radius:8px 5px 9px 5px; padding:9px 10px; width:100%;
  }
  .lbl{ font-size:13px; color:var(--soft); margin:2px 0 -2px; }
  .msg{ font-size:13.5px; margin-top:12px; line-height:1.5; min-height:1.2em; }
  .msg.err{ color:var(--neg); } .msg.ok{ color:var(--pos); }
  .note{ margin-top:16px; border:2px dashed var(--ink); border-radius:10px; background:var(--note); padding:12px 13px; font-size:13px; line-height:1.55; color:var(--soft); }
  .note b{ color:var(--ink); }
  .foot{ margin-top:16px; font-size:12.5px; color:var(--faint); text-align:center; }
  a{ color:var(--accent); }
  .mono{ font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all; color:var(--ink); }
  .hr{ height:0; border-top:1.5px dashed var(--faint); margin:16px 0; }
  .spin{ display:inline-block; animation:sp 1s linear infinite; } @keyframes sp{to{transform:rotate(360deg)}}
  .mt{ margin-top:12px; } .mt8{ margin-top:8px; }
</style>
</head>
<body>
<div id="root"><div class="card"><h1>Attention Radar</h1><p class="tag">loading sign-in…</p></div></div>

<script>
  // small shims some wallet deps expect in the browser
  window.global = window.global || window;
  window.process = window.process || { env: {}, nextTick: (f) => setTimeout(f, 0) };
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "@privy-io/react-auth": "https://esm.sh/@privy-io/react-auth@2?external=react,react-dom",
    "@privy-io/react-auth/solana": "https://esm.sh/@privy-io/react-auth@2/solana?external=react,react-dom"
  }
}
</script>
<script type="module">
import React, { useState, useEffect, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'https://esm.sh/htm@3.1.1';
import { PrivyProvider, usePrivy, useWallets } from '@privy-io/react-auth';
import { useSolanaWallets, toSolanaWalletConnectors } from '@privy-io/react-auth/solana';
import { Connection, PublicKey, Transaction, TransactionInstruction, SystemProgram } from 'https://esm.sh/@solana/web3.js@1.95.8';

const html = htm.bind(React.createElement);
const APP_ID = 'cml5e131s01tbjn0cl00eormz';
const solanaConnectors = toSolanaWalletConnectors();

// ---- minimal SPL-token helpers (avoid pulling @solana/spl-token) ----
const TOKEN_PROGRAM = new PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA');
const ATA_PROGRAM = new PublicKey('ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL');
function ataFor(owner, mint) {
  return PublicKey.findProgramAddressSync(
    [owner.toBuffer(), TOKEN_PROGRAM.toBuffer(), mint.toBuffer()], ATA_PROGRAM,
  )[0];
}
function u64le(n) {
  const b = new Uint8Array(8); let x = BigInt(n);
  for (let i = 0; i < 8; i++) { b[i] = Number(x & 0xffn); x >>= 8n; }
  return b;
}
function ixCreateAtaIdempotent(payer, ata, owner, mint) {
  return new TransactionInstruction({
    programId: ATA_PROGRAM,
    keys: [
      { pubkey: payer, isSigner: true, isWritable: true },
      { pubkey: ata, isSigner: false, isWritable: true },
      { pubkey: owner, isSigner: false, isWritable: false },
      { pubkey: mint, isSigner: false, isWritable: false },
      { pubkey: SystemProgram.programId, isSigner: false, isWritable: false },
      { pubkey: TOKEN_PROGRAM, isSigner: false, isWritable: false },
    ],
    data: new Uint8Array([1]), // idempotent create
  });
}
function ixTransferChecked(source, mint, dest, owner, amount, decimals) {
  return new TransactionInstruction({
    programId: TOKEN_PROGRAM,
    keys: [
      { pubkey: source, isSigner: false, isWritable: true },
      { pubkey: mint, isSigner: false, isWritable: false },
      { pubkey: dest, isSigner: false, isWritable: true },
      { pubkey: owner, isSigner: true, isWritable: false },
    ],
    data: new Uint8Array([12, ...u64le(amount), decimals]),
  });
}

function humanErr(e) {
  if (!e) return 'something went wrong';
  if (e.code === 4001 || /reject/i.test(e.message || '')) return 'you rejected the transaction';
  if (/insufficient/i.test(e.message || '')) return 'not enough balance for the transfer + gas';
  return (e.message || String(e)).slice(0, 180);
}

function Gate() {
  const { ready, authenticated, user, login, logout, getAccessToken } = usePrivy();
  const { wallets } = useWallets();
  const { wallets: solWallets } = useSolanaWallets();
  const [phase, setPhase] = useState('boot');   // boot | need-login | checking | need-pay | paying | confirming | error
  const [msg, setMsg] = useState('');
  const [account, setAccount] = useState(null);
  const [info, setInfo] = useState(null);
  const [chain, setChain] = useState('base');
  const [pending, setPending] = useState(null); // { hash, chainKey } after a send, for a no-repay re-check

  useEffect(() => { fetch('/api/pay-info').then((r) => r.json()).then(setInfo).catch(() => {}); }, []);

  const evmWallet = useCallback(() => {
    const list = wallets || [];
    return list.find((w) => String(w.chainId || '').startsWith('eip155:'))
      || list.find((w) => /ethereum|evm|metamask|coinbase|wallet|privy|rabby|rainbow|injected/i.test(w.walletClientType || w.type || ''))
      || list[0] || null;
  }, [wallets]);

  const walletChainId = () => {
    const w = evmWallet();
    const n = parseInt(String((w && w.chainId) || '').split(':')[1], 10);
    return Number.isFinite(n) ? n : null;
  };

  const doSession = useCallback(async () => {
    setPhase('checking'); setMsg('');
    try {
      const t = await getAccessToken();
      if (!t) { setPhase('need-login'); return; }
      const r = await fetch('/api/session', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ privyToken: t }) });
      const j = await r.json();
      if (r.ok && j.paid) { window.location.href = '/'; return; }
      setAccount(j.account || null);
      setPhase('need-pay');
    } catch (e) { setMsg(humanErr(e)); setPhase('error'); }
  }, [getAccessToken]);

  useEffect(() => {
    if (!ready) return;
    if (!authenticated) { setPhase('need-login'); return; }
    doSession();
  }, [ready, authenticated, doSession]);

  // auto-verify the sent tx, retrying while the chain / RPC catches up
  const confirmLoop = useCallback(async (hash, chainKey, n) => {
    setPhase('confirming');
    setMsg('payment sent — confirming on-chain… (' + (n + 1) + '/8)');
    try {
      const t = await getAccessToken();
      const r = await fetch('/api/pay-confirm', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ privyToken: t, txHash: hash, chain: chainKey }),
      });
      const j = await r.json();
      if (r.ok && j.paid) { window.location.href = '/'; return; }
      if (j.reason === 'tx_failed') {
        setPending(null); setPhase('need-pay');
        setMsg('that transaction failed on-chain — tap Pay to try again.');
        return;
      }
      const retryable = j.reason === 'no_match' || j.reason === 'rpc';
      if (retryable && n < 7) { setTimeout(() => confirmLoop(hash, chainKey, n + 1), 5000); return; }
      setPending({ hash, chainKey });
      setPhase('need-pay');
      setMsg((j.error || 'could not confirm that payment yet') + ' — use “Check payment” below, do not pay again.');
    } catch (e) {
      if (n < 7) { setTimeout(() => confirmLoop(hash, chainKey, n + 1), 5000); return; }
      setPending({ hash, chainKey });
      setPhase('need-pay');
      setMsg(humanErr(e) + ' — use “Check payment” below.');
    }
  }, [getAccessToken]);

  const paySolana = useCallback(async () => {
    const c = info.chains.find((x) => x.key === 'solana');
    const w = (solWallets || [])[0];
    if (!w) throw new Error('connect a Solana wallet (Phantom, Solflare…) to pay on Solana');
    const rpc = 'https://solana-rpc.publicnode.com';
    const conn = new Connection(rpc, 'confirmed');
    const from = new PublicKey(w.address);
    const mint = new PublicKey(c.usdcMint);
    const receiver = new PublicKey(c.receiver);
    const fromAta = ataFor(from, mint);
    const toAta = ataFor(receiver, mint);
    const amount = Math.round(info.priceUsdc * 1e6);
    const tx = new Transaction();
    tx.add(ixCreateAtaIdempotent(from, toAta, receiver, mint));
    tx.add(ixTransferChecked(fromAta, mint, toAta, from, amount, 6));
    const { blockhash } = await conn.getLatestBlockhash('confirmed');
    tx.recentBlockhash = blockhash;
    tx.feePayer = from;
    setMsg('confirm the ' + info.priceUsdc + ' USDC transfer in your wallet…');
    let sig;
    try { sig = await w.sendTransaction(tx, conn); }
    catch (e1) {
      try { sig = await w.sendTransaction({ transaction: tx, connection: conn }); }
      catch (_) { throw e1; }
    }
    const s = typeof sig === 'string' ? sig : (sig && (sig.signature || sig.hash)) || '';
    await confirmLoop(s, 'solana', 0);
  }, [info, solWallets, confirmLoop]);

  const payWithWallet = useCallback(async () => {
    if (!info) return;
    setPending(null);
    setPhase('paying'); setMsg('opening your wallet…');
    try {
      if (chain === 'solana') { await paySolana(); return; }
      const w = evmWallet();
      if (!w) throw new Error('connect an EVM wallet to pay');
      let target = info.chains.find((x) => x.key === chain) || info.chains.find((x) => x.key === 'base');
      // switch to the chosen network; if the user declines, fall back to whatever the wallet is on (if supported)
      setMsg('switching to ' + target.name + '…');
      try {
        await w.switchChain(target.id);
      } catch (_) {
        const cur = walletChainId();
        const onChain = cur && info.chains.find((x) => x.id === cur);
        if (!onChain) throw new Error('approve the network switch, or move your wallet to a supported network, then tap Pay');
        target = onChain;
      }
      const provider = await w.getEthereumProvider();
      const amount = BigInt(Math.round(info.priceUsdc * 1e6));
      const data = '0xa9059cbb'
        + info.payTo.toLowerCase().replace(/^0x/, '').padStart(64, '0')
        + amount.toString(16).padStart(64, '0');
      setMsg('confirm the ' + info.priceUsdc + ' USDC transfer in your wallet…');
      const hash = await provider.request({
        method: 'eth_sendTransaction',
        params: [{ from: w.address, to: target.usdc, data }],
      });
      await confirmLoop(hash, target.key, 0);
    } catch (e) { setPhase('need-pay'); setMsg(humanErr(e)); }
  }, [info, chain, evmWallet, confirmLoop, paySolana]);

  // ---- render ----
  if (phase === 'boot' || !ready) {
    return html`<div class="card"><h1>Attention Radar</h1><p class="tag">starting up…</p></div>`;
  }

  if (phase === 'need-login') {
    return html`<div class="card">
      <h1>Attention Radar</h1>
      <p class="tag">Memecoins are attention markets. Sign in to continue.</p>
      <div class="row">
        <button class="pri" onClick=${() => login()}>Connect wallet or email</button>
      </div>
      <div class="note">One account per person. Connect a wallet or use email, pay once in USDC, and you're in for good.</div>
      <p class="foot">Not financial advice · <a href="/bot.html">about Morty Bot</a></p>
    </div>`;
  }

  if (phase === 'checking') {
    return html`<div class="card"><h1>Attention Radar</h1><p class="tag"><span class="spin">◠</span> checking your access…</p></div>`;
  }

  if (phase === 'error') {
    return html`<div class="card">
      <h1>Attention Radar</h1>
      <p class="tag">Hit a snag.</p>
      <div class="msg err">${msg}</div>
      <div class="row mt"><button onClick=${doSession}>Try again</button>
      <button onClick=${() => logout().then(() => setPhase('need-login'))}>Sign out</button></div>
    </div>`;
  }

  // need-pay / paying / confirming
  const who = account?.email || user?.email?.address || user?.wallet?.address || 'your wallet';
  const busy = phase === 'paying' || phase === 'confirming';
  const priceStr = info ? info.priceUsdc : 10;
  return html`<div class="card">
    <h1>One-time access</h1>
    <p class="tag">Signed in as <b>${who}</b>. Pay <b>${priceStr} USDC</b> once to unlock the dashboard.</p>

    <div class="row">
      <span class="lbl">Network</span>
      <select value=${chain} onChange=${(e) => setChain(e.target.value)} disabled=${busy}>
        ${(info?.chains || [{ key: 'base', name: 'Base' }]).map((c) => html`<option key=${c.key} value=${c.key}>${c.name}</option>`)}
      </select>
      <button class="pri" onClick=${payWithWallet} disabled=${busy || !info}>
        ${busy ? html`<span class="spin">◠</span> ${phase === 'confirming' ? 'confirming…' : 'working…'}` : `Pay ${priceStr} USDC`}
      </button>
      ${pending ? html`<button onClick=${() => confirmLoop(pending.hash, pending.chainKey, 0)} disabled=${busy}>Check payment</button>` : ''}
    </div>

    <div class="msg ${/could not|fail|reject|snag|no USDC|approve|supported|already/i.test(msg) ? 'err' : 'ok'}">${msg}</div>

    <div class="note">
      <div>Pick a network, tap <b>Pay</b>, and approve the network switch + the <b>${priceStr} USDC</b> transfer in your wallet. It's picked up automatically.</div>
      <div class="mt8">Arranged access with <b><a href="https://x.com/codeswithroh" target="_blank" rel="noopener">@codeswithroh</a></b>? Once your account is marked paid, hit ${' '}
      <a href="#" onClick=${(e) => { e.preventDefault(); doSession(); }}>refresh</a>.</div>
    </div>

    <p class="foot"><a href="#" onClick=${(e) => { e.preventDefault(); logout().then(() => setPhase('need-login')); }}>use a different account</a></p>
  </div>`;
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div class="card">
      <h1>Attention Radar</h1>
      <p class="tag">The sign-in screen hit an error.</p>
      <div class="msg err">${String(this.state.err && this.state.err.message || this.state.err).slice(0, 200)}</div>
      <div class="row mt">
        <button class="pri" onClick=${() => window.location.reload()}>Reload</button>
        <button onClick=${() => { try { window.localStorage.clear(); } catch (_) {} window.location.reload(); }}>Reset & reload</button>
      </div>
    </div>`;
  }
}

function App() {
  return html`<${ErrorBoundary}><${PrivyProvider} appId=${APP_ID} config=${{
    loginMethods: ['wallet', 'email'],
    embeddedWallets: { createOnLogin: 'off' },
    externalWallets: { solana: { connectors: solanaConnectors } },
    appearance: {
      theme: 'light',
      accentColor: '#cf3a26',
      logo: '/morty.png',
      walletChainType: 'ethereum-and-solana',
      walletList: ['detected_wallets', 'phantom', 'solflare', 'metamask', 'coinbase_wallet', 'wallet_connect', 'rabby_wallet', 'rainbow'],
    },
  }}><${Gate} /><//><//>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
